<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娯楽時間管理</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 娯楽時間管理</h1>
            <p class="subtitle">1週間の娯楽時間をスマートに管理</p>
        </header>

        <main>
            <!-- 設定セクション -->
            <section class="settings-section">
                <h2>週間目標設定</h2>
                <div class="input-group">
                    <label for="weeklyBudget">1週間の娯楽時間（時間）:</label>
                    <input type="number" id="weeklyBudget" min="0" max="168" step="0.5" value="14">
                    <button id="saveBudget" class="btn btn-primary">保存</button>
                </div>
            </section>

            <!-- ステータス表示 -->
            <section class="status-section">
                <div class="week-info">
                    <p id="weekRange"></p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">目標時間</div>
                        <div class="stat-value" id="totalBudget">14.0</div>
                        <div class="stat-unit">時間</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-label">使用時間</div>
                        <div class="stat-value" id="usedTime">0.0</div>
                        <div class="stat-unit">時間</div>
                    </div>

                    <div class="stat-card highlight">
                        <div class="stat-label">残り時間</div>
                        <div class="stat-value" id="remainingTime">14.0</div>
                        <div class="stat-unit">時間</div>
                    </div>
                </div>

                <!-- プログレスバー -->
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <p class="progress-text" id="progressText">0% 使用</p>
            </section>

            <!-- タイマーセクション -->
            <section class="timer-section">
                <h2>娯楽タイマー</h2>
                <div class="timer-display" id="timerDisplay">00:00:00</div>
                <div class="timer-controls">
                    <button id="startTimer" class="btn btn-success">開始</button>
                    <button id="stopTimer" class="btn btn-danger" disabled>停止</button>
                    <button id="resetTimer" class="btn btn-secondary">リセット</button>
                </div>
            </section>

            <!-- 履歴セクション -->
            <section class="history-section">
                <h2>今週の履歴</h2>
                <div id="historyList" class="history-list">
                    <p class="no-data">まだ記録がありません</p>
                </div>
                <button id="clearHistory" class="btn btn-warning">履歴をクリア</button>
            </section>

            <!-- 週リセット -->
            <section class="reset-section">
                <button id="resetWeek" class="btn btn-danger">週データをリセット</button>
            </section>
        </main>

        <footer>
            <p>データはブラウザのLocalStorageに保存されます</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
